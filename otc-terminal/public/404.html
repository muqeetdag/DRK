<!doctype html>
<html lang="en">

<style>
  .nf { min-height: 88vh; display: grid; place-items: center; text-align: center; padding: 30px; }

  .nf p { color: var(--muted); margin: 0 0 24px; }
  .nf .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
