# Copy this file to .github/workflows/build-apk.yml to run it.
# GitHub app: repo > three-dot menu > Create file > paste the name and this body.
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drk-wifi-apk
          path: DRKWiFi-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drk-signing-keystore
          path: .keys/*.jks
          if-no-files-found: ignore
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DRKWiFi-*.apk
