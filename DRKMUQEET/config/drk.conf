# ============================================================
#  DRKMUQEET — boot configuration
#  Edit this file, then run:  drk --boot
#  (or simply reboot — service.sh applies it automatically)
#  Leave a value empty ("") to skip that item.
#  Every item is applied with read-back verification; failures
#  are logged to /data/adb/drk/logs/boot.log — never silently ignored.
# ============================================================

# --- CPU ---
CPU_GOVERNOR=            # e.g. schedutil | interactive | powersave (auto-verified)
CPU_MIN_FREQ=            # kHz, e.g. 300000
CPU_MAX_FREQ=            # kHz, e.g. 1804800
CPU_BOOST=1              # 0/1 — input boost / sched boost on touch

# --- GPU ---
GPU_GOVERNOR=            # e.g. msm_adreno_tz
GPU_MAX_FREQ=            # Hz, e.g. 800000000

# --- Memory ---
SWAPPINESS=80
VFS_CACHE_PRESSURE=100
DIRTY_RATIO=20
DIRTY_BG_RATIO=10
MIN_FREE_KBYTES=          # e.g. 24576 (kernel may clamp; verified)
ZRAM_SIZE_MB=0           # 0 = off; e.g. 1536 to enable a 1.5 GB zram swap
ZRAM_ALGO=lz4            # lz4 | lzo | zstd (first supported wins)
ZSWAP=0                  # 0/1 — zswap compressed swap cache (if kernel has it)
KSM=0                    # 0/1 — kernel samepage merging (if compiled in)

# --- Storage ---
READ_AHEAD_KB=256
IO_SCHEDULER=            # cfq | noop | deadline | bfq | kyber (first available)
FSTRIM_BOOT=1            # 0/1 — run fstrim at boot

# --- Network ---
TCP_CONGESTION=          # bbr | cubic | reno (first available is used)
TCP_FASTOPEN=            # 0/1/2/3

# --- Privacy / security ---
ENABLE_DENYLIST=0        # 0/1 — enable Magisk DenyList at boot
DEVICE_SPOOF=0           # 0/1 — spoof device/build props (see: drk priv spoof)
SPOOF_FINGERPRINT=       # full fingerprint string; empty = built-in begonia preset

# --- Battery ---
CHARGE_LIMIT=0           # 0-100; 0 = off (only if kernel exposes charge control)
BATT_MONITOR=1           # 0/1 — log battery samples every 5 min (drkd)
TEMP_ALERT_C=45          # alert when any core/battery temp exceeds this (°C)

# --- Housekeeping ---
LOG_CLEAR_BOOT=1         # 0/1 — clear old logcat at boot
AUTO_TRIM_DAYS=7         # fstrim cadence for the drkd daemon
