plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.drk.exifviewer'
    compileSdk 34

    defaultConfig {
        applicationId "com.drk.exifviewer"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Core EXIF parsing (spec: androidx.exifinterface)
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Advanced metadata extraction (spec: drewnoakes)
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // UI
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    // NOTE: play-services-maps intentionally omitted — "Open in Maps" uses a
    // standard geo: intent, which needs no API key and no Google dependencies.
}
